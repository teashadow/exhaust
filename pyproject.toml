[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exhaust"
version = "0.1.0"
description = "MAD agent perf fuzz"
requires-python = ">=3.11"
dependencies = [
  "click>=8.0",
  "rich>=13.0",
  "httpx>=0.27",
]

[project.scripts]
exhaust = "exhaust_app.cli:main"
